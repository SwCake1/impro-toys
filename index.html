<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Небольшие инструменты для импровизации: выбирайте и начинайте играть."
    />
    <title>Инструменты для импровизации</title>
    <link rel="stylesheet" href="./shared/styles.css" />
  </head>
  <body class="catalog-page">
    <main class="catalog-shell">
      <header class="catalog-header">
        <p class="catalog-kicker">Всё для сцены</p>
        <h1 class="catalog-title">Инструменты для импровизации</h1>
        <p class="catalog-intro">
          Маленькие помощники для репетиций и игр.
        </p>
      </header>

      <ul class="tool-grid" aria-label="Доступные инструменты">
        <li>
          <a class="tool-card" href="./tools/bell/index.html">
            <span class="tool-card__content">
              <img
                class="tool-card__icon"
                src="./shared/assets/catalog-generated/bell.webp"
                alt=""
                width="120"
                height="120"
              />
              <span class="tool-card__name">Звонок</span>
            </span>
          </a>
        </li>
        <li>
          <a
            class="tool-card"
            href="./tools/word/index.html"
            style="--card-accent: #b47716; --card-accent-soft: rgba(212, 155, 71, 0.22)"
          >
            <span class="tool-card__content">
              <img
                class="tool-card__icon"
                src="./shared/assets/catalog-generated/word.webp"
                alt=""
                width="120"
                height="120"
              />
              <span class="tool-card__name">Слова</span>
            </span>
          </a>
        </li>
        <li>
          <a
            class="tool-card"
            href="./tools/emotion/index.html"
            style="--card-accent: #574483; --card-accent-soft: rgba(87, 68, 131, 0.18)"
          >
            <span class="tool-card__content">
              <img
                class="tool-card__icon"
                src="./shared/assets/catalog-generated/emotion.webp"
                alt=""
                width="120"
                height="120"
              />
              <span class="tool-card__name">Эмоции</span>
            </span>
          </a>
        </li>
        <li>
          <a
            class="tool-card"
            href="./tools/rap-battle/index.html"
            style="--card-accent: #d51e62; --card-accent-soft: rgba(255, 176, 0, 0.24)"
          >
            <span class="tool-card__content">
              <img
                class="tool-card__icon"
                src="./shared/assets/catalog-generated/rap-battle.webp"
                alt=""
                width="120"
                height="120"
              />
              <span class="tool-card__name">Темы батлов</span>
            </span>
          </a>
        </li>
        <li>
          <a
            class="tool-card"
            href="./tools/locations/index.html"
            style="--card-accent: #ffc74d; --card-accent-soft: rgba(255, 199, 77, 0.2)"
          >
            <span class="tool-card__content">
              <img
                class="tool-card__icon"
                src="./shared/assets/catalog-generated/locations.webp"
                alt=""
                width="120"
                height="120"
              />
              <span class="tool-card__name">Локации</span>
            </span>
          </a>
        </li>
        <li>
          <a
            class="tool-card"
            href="./tools/relationship/index.html"
            style="--card-accent: #2f6f6b; --card-accent-soft: rgba(47, 111, 107, 0.18)"
          >
            <span class="tool-card__content">
              <img
                class="tool-card__icon"
                src="./shared/assets/catalog-generated/relationship.webp"
                alt=""
                width="120"
                height="120"
              />
              <span class="tool-card__name">Отношения</span>
            </span>
          </a>
        </li>
        <li>
          <a
            class="tool-card"
            href="./tools/first-line/index.html"
            style="--card-accent: #c98a1f; --card-accent-soft: rgba(212, 155, 71, 0.26)"
          >
            <span class="tool-card__content">
              <img
                class="tool-card__icon"
                src="./shared/assets/catalog-generated/first-line.webp"
                alt=""
                width="120"
                height="120"
              />
              <span class="tool-card__name">Первая реплика</span>
            </span>
          </a>
        </li>
      </ul>

      <footer class="catalog-footer">
        <div class="catalog-footer__content">
          <p class="catalog-footer__title">Связь</p>

          <nav class="contact-actions" aria-label="Социальные сети автора">
            <a
              class="contact-action"
              href="https://t.me/Vlad_Smhn"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg
                class="contact-icon contact-icon--telegram"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M20.7 4.1 17.9 19c-.2 1.1-.8 1.4-1.7.9l-4.3-3.2-2.1 2c-.2.2-.4.4-.9.4l.3-4.4 8.1-7.3c.4-.3-.1-.5-.5-.2l-10 6.3-4.3-1.4c-.9-.3-.9-.9.2-1.3L19.5 4c.8-.3 1.5.2 1.2 1.1Z" />
              </svg>
              <span>Telegram</span>
            </a>

            <a
              class="contact-action"
              href="https://www.instagram.com/vlad_smhn/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg
                class="contact-icon contact-icon--instagram"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5" />
                <circle cx="12" cy="12" r="4.1" />
                <circle class="contact-icon__dot" cx="17.4" cy="6.8" r="1" />
              </svg>
              <span>Instagram</span>
            </a>
          </nav>
        </div>
      </footer>
    </main>
  </body>
</html>
